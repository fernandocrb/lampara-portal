# Despliegue de referencia (VPS, Docker Compose plano). Ver README.md.
#
# En el TrueNAS real esto NO se usa así: TrueNAS solo jala imágenes ya
# construidas, no compone Dockerfiles. Ahí el portal se instala como "Custom
# App" apuntando a esta misma imagen (ghcr.io/.../lampara-portal), y el túnel
# de Cloudflare es la app `cloudflared` que ya corre en el NAS — no el
# servicio `tunel` de aquí abajo, que es solo para quien despliegue esto
# suelto, sin TrueNAS de por medio.
#
# El puerto NO se publica hacia la red: solo lo alcanza cloudflared, en la
# misma red docker. Así el portal no queda expuesto en la LAN ni depende de
# abrir nada en el router.

services:
  portal:
    image: ghcr.io/fernandocrb/lampara-portal:latest
    container_name: lampara-portal
    restart: unless-stopped
    environment:
      # La dirección por la que llegan las iglesias. Se muestra en el panel para
      # poder copiarla, y decide si la cookie de sesión se marca como Secure.
      LAMPARA_URL_PUBLICA: ${LAMPARA_URL_PUBLICA:?falta la URL pública}
      # El hash de la contraseña del panel — nunca la contraseña.
      # Se genera con: npm run clave-admin
      LAMPARA_ADMIN_CLAVE_HASH: ${LAMPARA_ADMIN_CLAVE_HASH:?falta el hash de la contraseña}
      # Detrás del túnel, la IP real llega en una cabecera. Sin esto, todas las
      # iglesias comparten IP y el límite de peticiones las castiga juntas.
      LAMPARA_TRAS_PROXY: "si"
    volumes:
      # La clave privada de firma vive aquí. Este volumen es lo único que hay
      # que respaldar, y lo único cuya pérdida no tiene arreglo: sin él, todas
      # las licencias instaladas dejan de validar.
      - lampara-datos:/datos
    expose:
      - "8099"
    networks:
      - lampara

  # El túnel de Cloudflare. El token sale del panel de Cloudflare Zero Trust al
  # crear el túnel; ahí mismo se apunta el nombre público a http://portal:8099.
  tunel:
    image: cloudflare/cloudflared:latest
    container_name: lampara-tunel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?falta el token del túnel}
    depends_on:
      - portal
    networks:
      - lampara

volumes:
  lampara-datos:

networks:
  lampara:
