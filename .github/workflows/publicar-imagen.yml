name: Publicar imagen

# Construye y publica la imagen del portal en GitHub Container Registry en
# cada push a main. TrueNAS la jala desde ahí — no hay forma de subirle un
# Dockerfile directo por su interfaz web, así que este flujo es el puente.
#
# La imagen no lleva ningún secreto: la clave privada de firma y la
# contraseña del panel se generan después, en el volumen del propio NAS. Por
# eso el repo y el paquete pueden ser públicos sin exponer nada sensible.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lampara-portal:latest
            ghcr.io/${{ github.repository_owner }}/lampara-portal:${{ github.sha }}
